name: Deploy Storybook
run-name: ${{ github.actor }}의 스토리북 배포
on:
  pull_request:
    branches: ['develop']
    paths:
      - apps/storybook/**
      - packages/ui/src/**

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.changes.outputs.storybook }}

    # Dependabot 봇인 경우 배포 스킵
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Storybook changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            storybook:
              - 'apps/storybook/**'
              - 'packages/ui/src/**'

  chromatic:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile # 의존성 버전 불일치 허용

      - name: Build Storybook dependencies
        run: pnpm build --filter=storybook...

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          workingDir: apps/storybook
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}
          onlyChanged: true # TurboSnap 활성화
          externals: packages/(ui/src)/** # 외부 의존성 경로

      - name: Create comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: ${{github.event.number}}-storybook
          mode: 'recreate' # 기존 코멘트를 삭제하고 새로 생성
          message: |
            <table>
              <tr>
                <th>📚 Storybook</th>
                <td><a href="${{ steps.chromatic.outputs.storybookUrl }}">${{ steps.chromatic.outputs.storybookUrl }}</a></td>
              </tr>
              <tr>
                <th>🧪 Inspect</th>
                <td><a href="${{ steps.chromatic.outputs.buildUrl }}">${{ steps.chromatic.outputs.buildUrl }}</a></td>
              </tr>
              <tr>
                <th>🖼️ Changed</th>
                <td><strong>${{ steps.chromatic.outputs.changeCount }}</strong> changed</td>
              </tr>
            </table>
