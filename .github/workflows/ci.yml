name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

# 동일 브랜치의 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'apps/knockdog/**'
              - 'packages/**'

  ci:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # To re-enable type-check, add 'type-check' back into this list.
        command: ['lint', 'build']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.command }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.command }}-
            ${{ runner.os }}-turbo-

      - name: Next.js Cache
        if: matrix.command == 'build'
        uses: actions/cache@v5
        with:
          path: apps/knockdog/.next/cache
          key: ${{ runner.os }}-nextjs-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-
            ${{ runner.os }}-nextjs-

      - name: Run ${{ matrix.command }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.command }}" = "build" ]; then
            pnpm turbo run build --filter=knockdog...
          else
            pnpm turbo run "${{ matrix.command }}" --filter=knockdog
          fi
          echo "✅ **${{ matrix.command }}** passed" >> $GITHUB_STEP_SUMMARY
        env:
          TURBO_CACHE_DIR: .turbo
          NEXT_TELEMETRY_DISABLED: 1
          # CI 빌드용 환경변수
          NEXT_PUBLIC_API_BASE_URL: 'https://example.com'
