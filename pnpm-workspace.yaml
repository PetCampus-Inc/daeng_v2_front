packages:
  - "apps/*"
  - "packages/*"
  - "packages/headless-ui/*"

# Expo SDK 53의 Android 자동 연결에서 패키지를 루트에서도 찾을 수 있게 한다.
publicHoistPattern:
  - "expo-modules-autolinking"

# reanimated 플러그인이 선언 없이 불러서, pnpm에서는 해석이 끊긴다.
packageExtensions:
  react-native-reanimated:
    dependencies:
      "@babel/generator": "^7.29.7"
      "@babel/traverse": "^7.29.7"
      "@babel/types": "^7.29.7"
